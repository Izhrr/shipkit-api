permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # install dev/test dependencies (ensure you added requirements-dev.txt)
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # ensure a linter available if not in requirements-dev
          pip install ruff

      - name: Lint (ruff)
        run: |
          # allow non-zero if you prefer warnings; by default fail on issue
          ruff check .

      - name: Run tests (pytest)
        env:
          KOMERCE_API_KEY: ${{ github.secrets.KOMERCE_API_KEY }}
          JWT_SECRET_KEY: ${{ github.secrets.JWT_SECRET_KEY }}
        run: |
          pytest -q

      - name: Upload coverage.xml artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov (optional)
        if: ${{ github.secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ github.secrets.CODECOV_TOKEN }}
          files: coverage.xml

  build-and-push:
      name: Build & Push Docker (GHCR)
      runs-on: ubuntu-latest
      needs: test
      if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      
      permissions:
        contents: read
        packages: write
      
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set lowercase repository name
          id: repo_name
          run: |
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "repo=$REPO_LOWER" >> $GITHUB_OUTPUT

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v2
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push Docker image to GHCR
          uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: |
              ghcr.io/${{ steps.repo_name.outputs.repo }}:${{ github.sha }}
              ghcr.io/${{ steps.repo_name.outputs.repo }}:latest